server {
	listen 80;
	listen [::]:80;
	server_name airsoft.munkys.dev;

	root /var/www/airsoft;
	index index.html;

	# Featured current game at /, archive under /archive/
	location / {
		try_files $uri $uri/ =404;
	}

	# Long cache for static assets (images/fonts)
	location ~* \.(png|jpe?g|gif|svg|webp|ico|woff2?)$ {
		expires 30d;
		add_header Cache-Control "public, max-age=2592000";
	}

	# HTML should revalidate so new games show up promptly after a git pull
	location ~* \.html$ {
		add_header Cache-Control "no-cache";
	}
}

# After running: sudo certbot --nginx -d airsoft.munkys.dev
# Certbot will add the listen 443 / ssl_* lines and an HTTP->HTTPS redirect automatically.
